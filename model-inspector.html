<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LẰN RANH — Model Inspector</title>
<style>
:root{color-scheme:dark;--bg:#0b1117;--panel:#111b24;--line:#263541;--muted:#8da0ad;--text:#e7edf0;--accent:#8bb8a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif;overflow:hidden}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#0d151c}
.brand{font-weight:800;letter-spacing:.13em}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:12px;margin-left:12px;letter-spacing:0}
main{height:calc(100vh - 58px);display:grid;grid-template-columns:310px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sidehead{padding:14px;border-bottom:1px solid var(--line)}input,select,button{font:inherit;color:var(--text);background:#0b141b;border:1px solid var(--line);border-radius:7px;padding:9px}
input{width:100%;margin:8px 0}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{font-size:11px;padding:6px 9px;color:var(--muted)}button{cursor:pointer}button:hover,.filters button.active{border-color:var(--accent);color:var(--accent)}
#assetList{overflow:auto;padding:7px;flex:1}.asset{padding:10px;border:1px solid transparent;border-radius:7px;cursor:pointer;margin-bottom:3px}.asset:hover{background:#182630}.asset.active{background:#1b2c34;border-color:#46685d}.asset b{display:block;font-size:12px;overflow-wrap:anywhere}.asset small{color:var(--muted);font-size:10px}
#viewer{position:relative;min-width:0;min-height:0;background:#18232b}canvas{display:block;width:100%;height:100%}
.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.toolbar>*{pointer-events:auto}.toolbar button{background:#101a21e8;font-size:12px;padding:7px 10px}
#info{position:absolute;bottom:12px;left:12px;max-width:min(600px,calc(100% - 24px));padding:11px 13px;background:#0b141be8;border:1px solid var(--line);border-radius:8px;pointer-events:none}
#info strong{display:block;font-size:13px}#info small{color:var(--muted);font-size:11px;overflow-wrap:anywhere}
#status{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px;pointer-events:none}
#status.hidden{display:none}.check{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px}.check input{width:auto;margin:0}
#count{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:700px){main{grid-template-columns:190px 1fr}.sidehead{padding:9px}.asset{padding:8px}.toolbar{top:7px;left:7px}.toolbar button{font-size:10px;padding:6px 7px}#info{font-size:11px}}
</style>
</head>
<body>
<header><div class="brand">LẰN RANH <span>/</span> <span style="color:#e7edf0">MODEL INSPECTOR</span><span class="sub">3D ASSET REVIEW</span></div><div id="topStatus" style="font-size:11px;color:#8da0ad">Đang kết nối GitHub…</div></header>
<main>
<aside>
 <div class="sidehead"><b>THƯ VIỆN MÔ HÌNH</b><input id="search" placeholder="Tìm tên model…"><div class="filters" id="filters"><button class="active" data-cat="all">Tất cả</button><button data-cat="structures">Công trình</button><button data-cat="vegetation">Cây cối</button><button data-cat="nature">Đá / thiên nhiên</button><button data-cat="items">Vật phẩm</button><button data-cat="props">Đạo cụ</button><button data-cat="terrain">Địa hình</button></div><div id="count">Đang tải danh sách…</div></div>
 <div id="assetList"></div>
</aside>
<section id="viewer">
 <div class="toolbar"><button id="reset">⟳ Góc nhìn</button><button id="grid">Lưới: bật</button><button id="wire">Wireframe: tắt</button><button id="spin">Xoay: tắt</button><button id="bg">Nền: tối</button></div>
 <div id="status">Đang lấy danh sách GLB từ repository…</div>
 <div id="info"><strong>Chưa chọn mô hình</strong><small>Chọn một GLB trong danh sách bên trái để xem trực tiếp, xoay và kiểm tra kích thước.</small></div>
</section>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

const OWNER='028riu', REPO='LAN-RANH', ROOT='public/assets/models';
const list=document.querySelector('#assetList'), status=document.querySelector('#status'), info=document.querySelector('#info'), topStatus=document.querySelector('#topStatus'), count=document.querySelector('#count');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x18232b);
const camera=new THREE.PerspectiveCamera(45,1,.01,5000); camera.position.set(5,4,7);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; document.querySelector('#viewer').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.06;
scene.add(new THREE.HemisphereLight(0xdcecff,0x4b5149,2));
const key=new THREE.DirectionalLight(0xffedcf,3.2); key.position.set(7,12,8); scene.add(key);
const fill=new THREE.DirectionalLight(0x9fc8e8,1.1); fill.position.set(-8,4,-6); scene.add(fill);
const grid=new THREE.GridHelper(30,30,0x60786f,0x34464a); scene.add(grid);
const axes=new THREE.AxesHelper(2); axes.visible=false; scene.add(axes);
const loader=new GLTFLoader(); let current=null, allAssets=[], activeCat='all', wire=false, spinning=false, dark=true;
function resize(){const r=document.querySelector('#viewer').getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height)}
new ResizeObserver(resize).observe(document.querySelector('#viewer')); resize();
function niceSize(n){return n<1024? n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}
function renderList(){const q=document.querySelector('#search').value.toLowerCase();const filtered=allAssets.filter(a=>(activeCat==='all'||a.cat===activeCat)&&a.path.toLowerCase().includes(q));list.innerHTML='';for(const a of filtered){const el=document.createElement('div');el.className='asset'+(current?.userData?.assetPath===a.path?' active':'');el.innerHTML='<b></b><small></small>';el.querySelector('b').textContent=a.name;el.querySelector('small').textContent=a.cat+' · '+niceSize(a.size);el.onclick=()=>loadAsset(a,el);list.appendChild(el)}count.textContent=filtered.length+' / '+allAssets.length+' mô hình';}
document.querySelector('#search').addEventListener('input',renderList);
document.querySelector('#filters').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(!b)return;activeCat=b.dataset.cat;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));renderList()});
function frameObject(obj){const box=new THREE.Box3().setFromObject(obj);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());obj.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;const dist=max*1.8;camera.position.set(dist*.95,dist*.7,dist*1.15);camera.near=Math.max(.001,max/1000);camera.far=max*100;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.minDistance=max*.08;controls.maxDistance=max*15;controls.update();return {size,max};}
function setStatus(t,show=true){status.textContent=t;status.classList.toggle('hidden',!show)}
async function loadAsset(asset,el){setStatus('Đang tải mô hình: '+asset.name);topStatus.textContent='Đang tải GLB…';try{const url='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/main/'+asset.path;const gltf=await loader.loadAsync(url);if(current)scene.remove(current);current=gltf.scene;current.userData.assetPath=asset.path;current.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{m.userData.originalWireframe=m.wireframe||false})}}});scene.add(current);const {size}=frameObject(current);let meshes=0,verts=0,mats=new Set(),textures=0;current.traverse(o=>{if(o.isMesh){meshes++;verts+=o.geometry?.attributes?.position?.count||0;for(const m of (Array.isArray(o.material)?o.material:[o.material]))if(m){mats.add(m.name||'Material');if(m.map)textures++}}});info.innerHTML='<strong></strong><small></small>';info.querySelector('strong').textContent=asset.name;info.querySelector('small').textContent=asset.path+' · '+meshes+' meshes · '+verts.toLocaleString()+' vertices · '+mats.size+' materials · '+textures+' texture maps · '+size.x.toFixed(2)+' × '+size.y.toFixed(2)+' × '+size.z.toFixed(2);setStatus('',false);topStatus.textContent='Đã tải · '+niceSize(asset.size);renderList()}catch(err){console.error(err);setStatus('Không tải được model này. Kiểm tra kết nối hoặc file GLB.');topStatus.textContent='Lỗi tải mô hình';}}
document.querySelector('#reset').onclick=()=>{if(current)frameObject(current)};
document.querySelector('#grid').onclick=e=>{grid.visible=!grid.visible;e.target.textContent='Lưới: '+(grid.visible?'bật':'tắt')};
document.querySelector('#wire').onclick=e=>{wire=!wire;if(current)current.traverse(o=>{if(o.isMesh)for(const m of (Array.isArray(o.material)?o.material:[o.material]))m.wireframe=wire});e.target.textContent='Wireframe: '+(wire?'bật':'tắt')};
document.querySelector('#spin').onclick=e=>{spinning=!spinning;e.target.textContent='Xoay: '+(spinning?'bật':'tắt')};
document.querySelector('#bg').onclick=e=>{dark=!dark;scene.background.setHex(dark?0x18232b:0xb8c0bf);e.target.textContent='Nền: '+(dark?'tối':'sáng')};
async function init(){try{const res=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/git/trees/main?recursive=1');if(!res.ok)throw Error('GitHub API '+res.status);const data=await res.json();allAssets=(data.tree||[]).filter(x=>x.type==='blob'&&x.path.toLowerCase().endsWith('.glb')&&x.path.startsWith(ROOT+'/')).map(x=>{const rel=x.path.slice(ROOT.length+1);return {path:x.path,name:rel.split('/').pop().replace(/\.glb$/i,'').replace(/[-_]/g,' '),cat:rel.split('/')[0],size:x.size||0}}).sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name));topStatus.textContent='Đã tìm thấy '+allAssets.length+' GLB';setStatus(allAssets.length?'Chọn một mô hình ở danh sách bên trái.':'Không tìm thấy GLB trong thư mục models.',!allAssets.length);renderList()}catch(err){console.error(err);topStatus.textContent='Không kết nối được GitHub';setStatus('Không lấy được danh sách model. Hãy tải lại trang hoặc kiểm tra kết nối mạng.');}}
function animate(){requestAnimationFrame(animate);if(spinning&&current)current.rotation.y+=.004;controls.update();renderer.render(scene,camera)}animate();init();
</script>
</body>
</html>
